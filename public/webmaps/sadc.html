#svg path{stroke:#fff;stroke-width:1;cursor:pointer}
#svg path.on,#svg circle.on{stroke:var(--fg);stroke-width:2.5}

#big{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;margin:4px 0 8px}

#chg{margin-top:8px}b.up{color:#1a7f37}b.dn{color:#b42318}
.box{position:relative;height:190px;max-width:100%}
#sel{display:none;left:8px;top:8px;font-weight:400}
#msg{position:absolute;top:12px;left:12px;right:56px;z-index:4}
#msg:empty{display:none}
#veil{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.3)}
#tour{position:fixed;z-index:31;width:280px;max-width:90vw;max-height:80vh;overflow:auto;background:var(--gis-bg);border:1px solid var(--gis-line);padding:12px}
#tour p{margin:4px 0 10px}
.p0{top:52px;left:336px}.p1{bottom:60px;left:45%}.p2{top:35%;left:336px}
@media(max-width:760px){#sel{display:block}#tour{width:auto;max-width:none;left:5vw;right:5vw}.p0{top:12px}.p1{top:30%;bottom:auto}.p2{top:auto;bottom:24px}}

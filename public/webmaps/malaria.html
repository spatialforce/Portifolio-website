<!DOCTYPE html>
<html lang="en" class="gis gis-lay-float-left">
<head>
<meta charset="utf-8">
<title>Malaria prevalence in Africa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="gis.css">
<script src="gis.js"></script>
<style>
  .gis-map { background:#fff; }
  canvas#cv { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; }
  #yearNow { flex:none; width:44px; font-weight:600; font-size:var(--gis-t-title); }
  #trend { display:block; width:288px; height:170px; }
  #where { margin:0 0 2px; font-weight:600; }
  #tip { white-space:nowrap; }
  #tip b { font-weight:600; margin-left:6px; }
</style>
</head>
<body>
<main class="gis-map" id="map"><canvas id="cv"></canvas>
  <div class="gis-card gis-card--tr" style="width:230px"><h2 class="gis-h">Children carrying malaria</h2>
    <div class="gis-ramp" id="ramp"></div><div class="gis-ramp-lbl"><span>0%</span><span>20</span><span>40</span><span>60%</span></div>
    <ul class="gis-legend" style="margin-top:6px"><li><i class="gis-sw" id="noneSw"></i>No malaria mapped</li></ul></div>
  <div class="gis-timebar"><button class="gis-btn gis-btn--icon" id="play" type="button" aria-label="Play"><i class="bi bi-play-fill" id="ico"></i></button>
    <div id="yearNow">2000</div>
    <input class="gis-range gis-grow" id="yr" type="range" min="2000" max="2025" step="0.05" value="2000" aria-label="Year"></div>
  <div class="gis-attr">Data from the Malaria Atlas Project and Natural Earth. Map by Kudzanai Chakavarika</div>
  <button class="gis-btn gis-btn--icon gis-reopen" data-gis-toggle type="button" title="Show panel" aria-label="Show panel"><i class="bi bi-layout-sidebar"></i></button>
  <div class="gis-state" id="loading"><span class="gis-spin"></span>Loading 26 years of malaria maps</div>
</main>
<aside class="gis-panel">
  <header class="gis-panel__hd"><h1>Malaria prevalence in Africa</h1>
    <button class="gis-btn gis-btn--icon gis-btn--bare" data-gis-toggle type="button" title="Hide panel" aria-label="Hide panel"><i class="bi bi-layout-sidebar-inset"></i></button></header>
  <div class="gis-panel__bd">
    <section class="gis-sec"><p id="where">&nbsp;</p><p class="gis-value" id="big">&nbsp;</p><p class="gis-p" id="what"></p></section>
    <section class="gis-sec"><h2 class="gis-h" id="trendT">2000 to 2025</h2><canvas id="trend" width="288" height="170"></canvas></section>
    <section class="gis-sec gis-small gis-muted">Click the map to pick a place. Rates are for children aged 2 to 10.</section>
  </div>
</aside>
<div class="gis-tip" id="tip"></div>
<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
// ColorBrewer RdPu, nine classes, spread over 0 to 60%
const PAL = [[255, 247, 243], [253, 224, 221], [252, 197, 192], [250, 159, 181], [247, 104, 161], [221, 52, 151], [174, 1, 126], [122, 1, 119], [73, 0, 106]];
const TOP = 0.6, LAND = [228, 229, 226], SEA = "#ffffff";
const CITIES = [["Harare", -17.83, 31.05], ["Bulawayo", -20.15, 28.58], ["Lusaka", -15.42, 28.28], ["Lilongwe", -13.96, 33.79], ["Maputo", -25.92, 32.57],
  ["Beira", -19.83, 34.85], ["Nampula", -15.12, 39.27], ["Luanda", -8.84, 13.29], ["Kinshasa", -4.33, 15.31], ["Lubumbashi", -11.66, 27.48],
  ["Kisangani", 0.52, 25.2], ["Dar es Salaam", -6.82, 39.27], ["Dodoma", -6.17, 35.74], ["Mwanza", -2.52, 32.9], ["Nairobi", -1.29, 36.82],
  ["Kisumu", -0.09, 34.77], ["Mombasa", -4.04, 39.67], ["Kampala", 0.33, 32.58], ["Kigali", -1.95, 30.06], ["Bujumbura", -3.38, 29.36],
  ["Addis Ababa", 9.01, 38.76], ["Juba", 4.85, 31.58], ["Khartoum", 15.5, 32.56], ["Mogadishu", 2.05, 45.32], ["Bangui", 4.39, 18.56],
  ["Yaoundé", 3.87, 11.52], ["Douala", 4.05, 9.7], ["Libreville", 0.42, 9.47], ["Brazzaville", -4.26, 15.24], ["N'Djamena", 12.13, 15.06],
  ["Lagos", 6.52, 3.38], ["Abuja", 9.06, 7.49], ["Kano", 12.0, 8.52], ["Niamey", 13.51, 2.11], ["Ouagadougou", 12.37, -1.52],
  ["Accra", 5.6, -0.19], ["Kumasi", 6.69, -1.62], ["Abidjan", 5.36, -4.01], ["Bamako", 12.64, -8.0], ["Conakry", 9.64, -13.58],
  ["Freetown", 8.47, -13.23], ["Monrovia", 6.3, -10.8], ["Dakar", 14.72, -17.47], ["Banjul", 13.45, -16.58], ["Lomé", 6.13, 1.22],
  ["Cotonou", 6.37, 2.39], ["Antananarivo", -18.88, 47.51], ["Toamasina", -18.15, 49.4], ["Windhoek", -22.56, 17.08], ["Gaborone", -24.65, 25.91]];

const cv = $("cv"), cx = cv.getContext("2d"), trend = $("trend"), tx = trend.getContext("2d"), yr = $("yr"), tip = $("tip");
let M, grids = [], borders, W = 0, H = 0, dpr = 1, k = 1, ox = 0, oy = 0, year = 2000, here = null, layer = null, lctx, lim, playing = false, last = 0;

function colour(r) {
  const x = Math.min(1, r / TOP) * (PAL.length - 1), i = Math.min(PAL.length - 2, Math.floor(x)), f = x - i;
  return PAL[i].map((v, j) => Math.round(v + (PAL[i + 1][j] - v) * f));
}
const LUT = Array.from({ length: 201 }, (_, v) => colour(v * 0.005));
const pct = (r) => (r < 0.0095 ? "Under 1%" : Math.round(r * 100) + "%");

// rate at a cell for a year that may fall between two maps; -1 where nothing is mapped
function rateAt(i, y) {
  const f = Math.min(grids.length - 1, Math.max(0, y - 2000)), a = Math.floor(f), b = Math.min(grids.length - 1, a + 1), w = f - a;
  const u = grids[a][i], v = grids[b][i];
  if (u === 255 && v === 255) return -1;
  if (u === 255) return v * 0.005; if (v === 255) return u * 0.005;
  return (u + (v - u) * w) * 0.005;
}

function paint() {
  const f = Math.min(grids.length - 1, Math.max(0, year - 2000)), a = Math.floor(f), b = Math.min(grids.length - 1, a + 1), w = f - a;
  const A = grids[a], B = grids[b], d = lim.data;
  for (let i = 0, o = 0; i < A.length; i++, o += 4) {
    let u = A[i], v = B[i];
    if (u === 255 && v === 255) { d[o + 3] = 0; continue; }
    if (u === 255) u = v; else if (v === 255) v = u;
    const c = LUT[Math.round(u + (v - u) * w)];
    d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
  }
  lctx.putImageData(lim, 0, 0);
}

const px = (lon) => ox + (lon - M.box[0]) / (M.box[2] - M.box[0]) * M.w * k;
const py = (lat) => oy + (M.box[3] - lat) / (M.box[3] - M.box[1]) * M.h * k;
function fit() {
  // keep the map clear of the floating panel on wide screens
  const open = !document.documentElement.classList.contains("gis-collapsed") && innerWidth > 760;
  const thumb = document.documentElement.classList.contains("gis-thumb");
  const left = open ? 336 : 0, w = W - left, top = thumb ? 0 : 8, h = thumb ? H : H - 72;
  k = Math.min(w / M.w, h / M.h); ox = left + (w - M.w * k) / 2; oy = top + (h - M.h * k) / 2;
}
function ring() { cx.beginPath(); for (const r of borders) { r.forEach(([x, y], i) => (i ? cx.lineTo(px(x), py(y)) : cx.moveTo(px(x), py(y)))); cx.closePath(); } }

function draw() {
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.fillStyle = SEA; cx.fillRect(0, 0, W, H);
  ring(); cx.fillStyle = `rgb(${LAND})`; cx.fill();
  cx.imageSmoothingEnabled = true;
  cx.drawImage(layer, ox, oy, M.w * k, M.h * k);
  ring(); cx.lineWidth = 0.8; cx.strokeStyle = "rgba(27,31,36,.5)"; cx.stroke();
  if (here) {
    const x = px(here.lon), y = py(here.lat);
    cx.beginPath(); cx.arc(x, y, 6, 0, Math.PI * 2);
    cx.lineWidth = 3; cx.strokeStyle = "#fff"; cx.stroke(); cx.lineWidth = 1.5; cx.strokeStyle = "#111"; cx.stroke();
    cx.font = "600 13px 'Source Sans 3',sans-serif"; cx.textBaseline = "middle";
    cx.lineWidth = 3; cx.strokeStyle = "#fff"; cx.strokeText(here.name, x + 10, y); cx.fillStyle = "#111"; cx.fillText(here.name, x + 10, y);
  }
}

const cell = (lat, lon) => {
  const c = Math.floor((lon - M.box[0]) / (M.box[2] - M.box[0]) * M.w), r = Math.floor((M.box[3] - lat) / (M.box[3] - M.box[1]) * M.h);
  return c < 0 || r < 0 || c >= M.w || r >= M.h ? -1 : r * M.w + c;
};
const toGeo = (x, y) => [M.box[3] - (y - oy) / (M.h * k) * (M.box[3] - M.box[1]), M.box[0] + (x - ox) / (M.w * k) * (M.box[2] - M.box[0])];
function nameOf(lat, lon) {
  let name = `${Math.abs(lat).toFixed(1)}° ${lat < 0 ? "S" : "N"} ${Math.abs(lon).toFixed(1)}° ${lon < 0 ? "W" : "E"}`, best = 0.5;
  for (const [n, a, b] of CITIES) { const d = Math.hypot(a - lat, b - lon); if (d < best) { best = d; name = n; } }
  return name;
}
const meanAt = (y) => { const f = Math.min(M.years.length - 1, Math.max(0, y - 2000)), a = Math.floor(f), b = Math.min(M.years.length - 1, a + 1); return M.years[a].mean + (M.years[b].mean - M.years[a].mean) * (f - a); };

function panel() {
  const y = Math.floor(year + 1e-6);
  $("yearNow").textContent = y;
  if (here) {
    const r = rateAt(here.i, year);
    $("where").textContent = here.name;
    $("big").textContent = r < 0 ? "None" : pct(r);
    $("what").textContent = r < 0 ? `No malaria mapped here in ${y}.` : `of children carried malaria parasites in ${y}.`;
    $("trendT").textContent = `${here.name} 2000 to 2025`;
  } else {
    $("where").textContent = "Across the mapped land";
    $("big").textContent = pct(meanAt(year));
    $("what").textContent = `of children carried malaria parasites in ${y}.`;
    $("trendT").textContent = "2000 to 2025";
  }
  chart();
}

// the chosen place as a solid line, the average of the mapped land as a faint one
function chart() {
  const w = trend.width, h = trend.height, n = grids.length, L = 34, R = 8, T = 10, B = 22;
  const place = here ? grids.map((g) => (g[here.i] === 255 ? null : g[here.i] * 0.005)) : null, mean = M.years.map((d) => d.mean);
  const raw = Math.max(0.05, ...mean, ...(place || []).filter((v) => v != null)) * 1.08;
  const top = [0.1, 0.2, 0.4, 0.6, 0.8, 1].find((v) => v >= raw) || 1;
  const X = (i) => L + i / (n - 1) * (w - L - R), Y = (v) => T + (1 - v / top) * (h - T - B);
  tx.clearRect(0, 0, w, h);
  tx.font = "12px 'Source Sans 3',sans-serif"; tx.textBaseline = "middle";
  for (const v of [0, top / 2, top]) {
    tx.fillStyle = v ? "#e6e8eb" : "#9aa1a9"; tx.fillRect(L, Math.round(Y(v)), w - L - R, 1);
    tx.fillStyle = "#4d5560"; tx.textAlign = "right"; tx.fillText(Math.round(v * 100) + "%", L - 6, Y(v));
  }
  tx.textAlign = "center"; for (const i of [0, 10, 20, 25]) tx.fillText(2000 + i, Math.min(w - 16, Math.max(L + 12, X(i))), h - 8);
  const line = (vals, col, lw) => { tx.strokeStyle = col; tx.lineWidth = lw; tx.lineJoin = "round"; tx.beginPath(); let pen = false;
    vals.forEach((v, i) => { if (v == null) { pen = false; return; } pen ? tx.lineTo(X(i), Y(v)) : tx.moveTo(X(i), Y(v)); pen = true; }); tx.stroke(); };
  line(mean, place ? "#b9bfc6" : "#ae017e", place ? 1.5 : 2.5);
  if (place) line(place, "#ae017e", 2.5);
  const f = year - 2000, v = here ? rateAt(here.i, year) : meanAt(year);
  tx.fillStyle = "#1b1f24"; tx.fillRect(Math.round(X(f)), T, 1, h - T - B);
  if (v >= 0) { tx.beginPath(); tx.arc(X(f), Y(v), 4, 0, 7); tx.fillStyle = "#ae017e"; tx.fill(); tx.lineWidth = 1.5; tx.strokeStyle = "#fff"; tx.stroke(); }
}

function choose(lat, lon) {
  const i = cell(lat, lon);
  if (i < 0 || grids.every((g) => g[i] === 255)) { here = null; panel(); draw(); return; }
  here = { lat, lon, i, name: nameOf(lat, lon) }; panel(); draw();
}
cv.addEventListener("click", (e) => { const r = cv.getBoundingClientRect(); choose(...toGeo(e.clientX - r.left, e.clientY - r.top)); });
cv.addEventListener("pointermove", (e) => {
  const r = cv.getBoundingClientRect(), [lat, lon] = toGeo(e.clientX - r.left, e.clientY - r.top), i = cell(lat, lon), v = i < 0 ? -1 : rateAt(i, year);
  if (v < 0 || e.pointerType === "touch") { tip.style.display = "none"; return; }
  tip.innerHTML = `${nameOf(lat, lon)}<b>${pct(v)}</b>`; tip.style.display = "block";
  tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, e.clientX + 14) + "px"; tip.style.top = e.clientY + 14 + "px";
});
cv.addEventListener("pointerleave", () => { tip.style.display = "none"; });

function setYear(y) { year = Math.min(2025, Math.max(2000, y)); paint(); panel(); draw(); }
function setPlaying(p) { playing = p; last = 0; $("ico").className = p ? "bi bi-pause-fill" : "bi bi-play-fill"; $("play").setAttribute("aria-label", p ? "Pause" : "Play"); $("play").title = p ? "Pause" : "Play"; if (p) requestAnimationFrame(frame); }
function frame(now) {
  if (!playing) return;
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0; last = now;
  setYear(year + dt * 2.2); yr.value = year;
  if (year >= 2025) { setPlaying(false); return; }
  requestAnimationFrame(frame);
}
$("play").onclick = () => { if (!playing && year >= 2025) { year = 2000; } setPlaying(!playing); };
yr.oninput = () => { setPlaying(false); setYear(+yr.value); };
addEventListener("keydown", (e) => { if (e.key === " " && e.target.tagName !== "INPUT" && e.target.tagName !== "BUTTON") { e.preventDefault(); $("play").click(); } if (e.key === "Escape") { here = null; panel(); draw(); } });

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  const r = $("map").getBoundingClientRect(); W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr;
  if (layer) { fit(); draw(); }
}
addEventListener("resize", resize);

$("ramp").style.background = `linear-gradient(90deg,${PAL.map((c) => `rgb(${c})`).join(",")})`;
$("noneSw").style.background = `rgb(${LAND})`;
const img = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
Promise.all([fetch("malaria/malaria.json").then((r) => r.json()), fetch("malaria/borders.json").then((r) => r.json())])
  .then(async ([m, b]) => {
    M = m; borders = b.filter((r) => r[0][0] > M.box[0] - 12 && r[0][0] < M.box[2] + 20);   // drop far-off territories
    const c = document.createElement("canvas"); c.width = M.w; c.height = M.h;
    const g = c.getContext("2d", { willReadFrequently: true });
    const pics = await Promise.all(M.years.map((s) => img(`malaria/${s.year}.png`)));
    grids = pics.map((p) => { g.clearRect(0, 0, M.w, M.h); g.drawImage(p, 0, 0); const d = g.getImageData(0, 0, M.w, M.h).data, a = new Uint8Array(M.w * M.h); for (let i = 0; i < a.length; i++) a[i] = d[i * 4]; return a; });
    layer = document.createElement("canvas"); layer.width = M.w; layer.height = M.h; lctx = layer.getContext("2d"); lim = lctx.createImageData(M.w, M.h);
    resize(); setYear(2000); GIS.state($("loading"), null);
    // play through the years once, unless this is a thumbnail or motion is reduced
    if (!reduce && !document.documentElement.classList.contains("gis-thumb")) setTimeout(() => setPlaying(true), 900);
  })
  .catch(() => GIS.state($("loading"), "The malaria data could not be loaded. Run tools/malaria/build.py.", true));
})();
</script>
</body>
</html>
